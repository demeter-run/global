name: incident-report

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Report window in months back from now"
        required: false
        default: "6"
  pull_request:
    branches:
      - main
    paths:
      - scripts/incident_report.py
      - scripts/requirements.txt
      - .github/workflows/incident-report.yml
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  incident-report:
    name: incident-report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Sops Binary Installer
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
      - name: Decrypt config.yaml
        run: sops -d -i config.yaml
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Generate incident report
        # The report is delivered to Discord and uploaded as a build artifact;
        # it is never committed, since this repository is public. The webhook is
        # read from the decrypted config (grafana.cloud.discord_webhook_url).
        # TEMP: posting is enabled on PRs to validate delivery; revert to
        # scheduled/manual-only before merge.
        run: python3 scripts/incident_report.py --months "${{ inputs.months || '6' }}" --out-dir report-out --discord-from-config
      - name: Discard decrypted config
        if: always()
        run: git checkout -- config.yaml
      - name: Upload report artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: demeter-incident-report
          path: |
            report-out/report-latest.md
            report-out/incidents.csv
          if-no-files-found: error
